services:
  mongo:
    image: mongo:7
    container_name: bhetghat-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: bhetghat
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  seeder:
    build:
      context: ./backend
    container_name: bhetghat-seeder
    command: ["./seeder"]
    environment:
      MONGODB_URI: mongodb://root:rootpassword@mongo:27017/bhetghat?authSource=admin
    depends_on:
      - mongo
    # restart: no

  # ion-sfu:
  #   image: pionwebrtc/ion-sfu:latest-jsonrpc
  #   container_name: bhetghat-sfu
  #   restart: unless-stopped
  #   volumes:
  #     - ./ion-sfu/sfu.toml:/configs/sfu.toml
  #   ports:
  #     - "7000:7000"
  #     - "5000-5200:5000-5200/udp"

  backend:
    build:
      context: ./backend
    container_name: bhetghat-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      MONGODB_URI: mongodb://root:rootpassword@mongo:27017/bhetghat?authSource=admin
      JWT_SECRET: jelloWorld
      CLIENT_URL: http://localhost
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GAME_SERVER: http://localhost:8000
        VITE_GAME_WS: ws://localhost:8000/ws
        VITE_SFU_WS: ws://localhost:7000/ws
    container_name: bhetghat-frontend
    restart: unless-stopped
    ports:
      - "7777:80"
    depends_on:
      - backend

volumes:
  mongo_data:
